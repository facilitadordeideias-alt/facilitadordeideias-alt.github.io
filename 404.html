<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — Vitor Henrique · Vital</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d0c">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#0b0d0c; }
  * { box-sizing:border-box; }
  body {
    color:#f2f4f1; font-family:Archivo,Helvetica,sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:grid; place-items:center; padding:clamp(24px,6vw,64px);
  }
  main { display:grid; gap:20px; max-width:44ch; justify-items:start; }
  .tag {
    display:inline-flex; align-items:center; gap:9px; font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#3fd06a;
  }
  .dot { width:6px; height:6px; border-radius:50%; background:#3fd06a; display:block; }
  h1 { font-size:clamp(30px,5vw,52px); line-height:1.05; letter-spacing:-.035em; font-weight:800; margin:0; }
  p { font-size:17px; line-height:1.6; color:#b4bfb8; margin:0; }
  a.cta {
    background:#3fd06a; color:#08130c; font-weight:700; font-size:15px; padding:15px 26px;
    border-radius:10px; text-decoration:none; transition:background .25s, transform .25s;
  }
  a.cta:hover { background:#5ade82; transform:translateY(-2px); }
</style>
</head>
<body>
<main>
  <span class="tag"><span class="dot"></span>Erro 404</span>
  <h1>Essa página não existe.</h1>
  <p>O link pode estar quebrado ou o conteúdo saiu do ar. Volte para a página inicial para continuar.</p>
  <a class="cta" href="/">Ir para a página inicial</a>
</main>
</body>
</html>
